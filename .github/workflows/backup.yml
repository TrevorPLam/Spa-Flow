name: Database Backup

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to backup'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - staging
          - production

env:
  BACKUP_RETENTION_DAYS: 30

jobs:
  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - production
          - staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gnupg gzip

      - name: Load environment variables
        run: |
          if [ "${{ matrix.environment }}" == "production" ]; then
            echo "Loading production environment..."
            # Production secrets should be set in GitHub Actions secrets
            echo "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" >> $GITHUB_ENV
            echo "BACKUP_ENCRYPTION_KEY=${{ secrets.BACKUP_ENCRYPTION_KEY }}" >> $GITHUB_ENV
          elif [ "${{ matrix.environment }}" == "staging" ]; then
            echo "Loading staging environment..."
            echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" >> $GITHUB_ENV
            echo "BACKUP_ENCRYPTION_KEY=${{ secrets.BACKUP_ENCRYPTION_KEY }}" >> $GITHUB_ENV
          else
            echo "Loading development environment..."
            echo "DATABASE_URL=${{ secrets.DEVELOPMENT_DATABASE_URL }}" >> $GITHUB_ENV
            echo "BACKUP_ENCRYPTION_KEY=${{ secrets.BACKUP_ENCRYPTION_KEY }}" >> $GITHUB_ENV
          fi

      - name: Create backup directory
        run: mkdir -p /tmp/spaflow-backups

      - name: Run backup script
        id: backup
        env:
          BACKUP_DIR: /tmp/spaflow-backups
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh ${{ matrix.environment }}
        continue-on-error: false

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaflow-backup-${{ matrix.environment }}-${{ github.run_number }}
          path: /tmp/spaflow-backups/spaflow_*.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Upload backup logs
        uses: actions/upload-artifact@v4
        with:
          name: backup-logs-${{ matrix.environment }}-${{ github.run_number }}
          path: /tmp/spaflow-backups/backup_*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Calculate backup size
        id: backup_info
        run: |
          BACKUP_FILE=$(ls /tmp/spaflow-backups/spaflow_*.sql.gz.gpg | head -n 1)
          BACKUP_SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
          BACKUP_SIZE_BYTES=$(du -b "$BACKUP_FILE" | cut -f1)
          echo "backup_size=${BACKUP_SIZE}" >> $GITHUB_OUTPUT
          echo "backup_size_bytes=${BACKUP_SIZE_BYTES}" >> $GITHUB_OUTPUT
          echo "Backup size: ${BACKUP_SIZE}"

      - name: Send backup notification on success
        if: success()
        run: |
          echo "Backup completed successfully for ${{ matrix.environment }}"
          echo "Size: ${{ steps.backup_info.outputs.backup_size }}"
          # Add notification integration here (Slack, email, etc.)

      - name: Send backup notification on failure
        if: failure()
        run: |
          echo "Backup failed for ${{ matrix.environment }}"
          # Add alert integration here (Slack, PagerDuty, etc.)
          exit 1

  backup-monitoring:
    name: Backup Monitoring
    runs-on: ubuntu-latest
    needs: backup
    steps:
      - name: Check backup status
        run: |
          echo "Backup monitoring check"
          echo "All backups completed successfully"
          
      - name: Log backup metrics
        run: |
          echo "Backup metrics for run ${{ github.run_number }}"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Repository: ${{ github.repository }}"
          
      - name: Create backup summary
        run: |
          echo "## Backup Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention**: 30 days" >> $GITHUB_STEP_SUMMARY
