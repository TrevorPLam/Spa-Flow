name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run mutation tests weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run pnpm audit on api-server
        run: pnpm audit --audit-level=high
        working-directory: artifacts/api-server
      - name: Run pnpm audit on spaflow
        run: pnpm audit --audit-level=high
        working-directory: artifacts/spaflow

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [security-scan, codeql]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup build cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/api-server/dist
            artifacts/spaflow/dist
          key: ${{ runner.os }}-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/src/**', '**/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run build

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run Smoke Tests
        run: pnpm -r --if-present run test:fast

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Detect Changed Packages
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Check if api-server changed
          if git diff --name-only $BASE_SHA ${{ github.sha }} | grep -q "artifacts/api-server/"; then
            echo "api_server_changed=true" >> $GITHUB_OUTPUT
          else
            echo "api_server_changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Run Contract Tests
        if: steps.detect.outputs.api_server_changed == 'true' || github.ref == 'refs/heads/main'
        run: cd artifacts/api-server && pnpm run test -- src/routes/clients.test.ts src/routes/checkin.test.ts

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup vitest cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/spaflow/node_modules/.vite
            artifacts/api-server/node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitest-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Detect Changed Packages
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Check if spaflow changed
          if git diff --name-only $BASE_SHA ${{ github.sha }} | grep -q "artifacts/spaflow/"; then
            echo "spaflow_changed=true" >> $GITHUB_OUTPUT
          else
            echo "spaflow_changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Run Component Tests
        if: steps.detect.outputs.spaflow_changed == 'true' || github.ref == 'refs/heads/main'
        run: cd artifacts/spaflow && pnpm run test

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [component-tests, contract-tests]
    if: always() && (needs.component-tests.result == 'success' || needs.contract-tests.result == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup vitest cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/spaflow/node_modules/.vite
            artifacts/api-server/node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitest-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Detect Changed Packages
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Check if packages changed
          if git diff --name-only $BASE_SHA ${{ github.sha }} | grep -q "artifacts/api-server/"; then
            echo "api_server_changed=true" >> $GITHUB_OUTPUT
          else
            echo "api_server_changed=false" >> $GITHUB_OUTPUT
          fi
          
          if git diff --name-only $BASE_SHA ${{ github.sha }} | grep -q "artifacts/spaflow/"; then
            echo "spaflow_changed=true" >> $GITHUB_OUTPUT
          else
            echo "spaflow_changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Run Coverage for API Server
        if: steps.detect.outputs.api_server_changed == 'true'
        run: cd artifacts/api-server && pnpm run test:coverage:ci
      - name: Run Coverage for Spaflow
        if: steps.detect.outputs.spaflow_changed == 'true'
        run: cd artifacts/spaflow && pnpm run test:coverage:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-server-coverage
          path: artifacts/api-server/coverage/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spaflow-coverage
          path: artifacts/spaflow/coverage/
          retention-days: 30

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Install Playwright Browsers
        run: cd artifacts/spaflow && pnpm exec playwright install --with-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'
      - name: Detect Changed Packages
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Check if spaflow changed
          if git diff --name-only $BASE_SHA ${{ github.sha }} | grep -q "artifacts/spaflow/"; then
            echo "spaflow_changed=true" >> $GITHUB_OUTPUT
          else
            echo "spaflow_changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Run E2E Tests (including visual regression)
        if: steps.detect.outputs.spaflow_changed == 'true' || github.ref == 'refs/heads/main'
        run: cd artifacts/spaflow && pnpm run test:e2e
        env:
          # Ensure consistent rendering in CI
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:5173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: artifacts/spaflow/playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-snapshots-diff
          path: artifacts/spaflow/tests/e2e/*.spec.ts-snapshots/
          retention-days: 7

  smoke-load-tests:
    name: Smoke Load Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E34C5A
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt update
          sudo apt install k6
      - name: Start API Server
        run: |
          cd artifacts/api-server
          pnpm run build
          pnpm run start &
          chmod +x ../../scripts/wait-for-server.sh
          ../../scripts/wait-for-server.sh http://localhost:5000/health 12 5
      - name: Run Smoke Load Tests
        run: k6 run load-tests/smoke.js
        env:
          API_BASE_URL: http://localhost:5000/api

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: [build, smoke-load-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E34C5A
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt update
          sudo apt install k6
      - name: Start API Server
        run: |
          cd artifacts/api-server
          pnpm run build
          pnpm run start &
          chmod +x ../../scripts/wait-for-server.sh
          ../../scripts/wait-for-server.sh http://localhost:5000/health 12 5
      - name: Run Load Tests
        run: |
          pnpm run test:load:health
          pnpm run test:load:clients
          pnpm run test:load:dashboard
          pnpm run test:load:checkin
        env:
          API_BASE_URL: http://localhost:5000/api

  mutation-tests:
    name: Mutation Tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30
    # Run on schedule (weekly) and manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup stryker cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/api-server/.stryker-tmp
            artifacts/api-server/node_modules/.cache
          key: ${{ runner.os }}-stryker-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stryker-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run Mutation Tests
        run: cd artifacts/api-server && pnpm run test:mutation:ci
        continue-on-error: true # Continue even if tests fail due to integration issues
      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: artifacts/api-server/reports/mutation/
          retention-days: 30
