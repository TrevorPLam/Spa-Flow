name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run pnpm audit on api-server
        run: pnpm audit --audit-level=high
        working-directory: artifacts/api-server
      - name: Run pnpm audit on spaflow
        run: pnpm audit --audit-level=high
        working-directory: artifacts/spaflow

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [security-scan, codeql]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup build cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/api-server/dist
            artifacts/spaflow/dist
          key: ${{ runner.os }}-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/src/**', '**/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run build

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup vitest cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/spaflow/node_modules/.vite
            artifacts/api-server/node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitest-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run Smoke Tests - Backend
        run: cd artifacts/api-server && pnpm run test -- --tags-filter="smoke and critical"
      - name: Run Smoke Tests - Frontend
        run: cd artifacts/spaflow && pnpm run test -- --tags-filter="smoke and critical"

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup package-specific cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/api-server/node_modules/.cache
            artifacts/spaflow/node_modules/.cache
          key: ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/src/**', '**/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-pkg-cache-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run Contract Tests for Changed Packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Use pnpm --filter to run contract tests only for changed packages
          pnpm --filter="...[$BASE_SHA]" --if-present run test:contract
        shell: bash

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup package-specific cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/api-server/node_modules/.cache
            artifacts/spaflow/node_modules/.cache
          key: ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/src/**', '**/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-pkg-cache-
      - name: Setup vitest cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/spaflow/node_modules/.vite
            artifacts/api-server/node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitest-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run Component Tests for Changed Packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Use pnpm --filter to run tests only for changed packages
          pnpm --filter="...[$BASE_SHA]" --if-present run test:changed
        shell: bash

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup package-specific cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/api-server/node_modules/.cache
            artifacts/spaflow/node_modules/.cache
          key: ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/src/**', '**/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-pkg-cache-
      - name: Setup vitest cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/spaflow/node_modules/.vite
            artifacts/api-server/node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitest-
      - name: Setup performance baseline cache
        uses: actions/cache@v5
        with:
          path: .performance-baseline.json
          key: ${{ runner.os }}-perf-baseline-${{ github.base_ref || 'main' }}
          restore-keys: |
            ${{ runner.os }}-perf-baseline-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run API Performance Tests
        run: cd artifacts/api-server && pnpm run test src/test/performance.test.ts
        continue-on-error: true
      - name: Upload API Performance Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-performance-metrics
          path: artifacts/api-server/test-results/
          retention-days: 90
      - name: Run Frontend Performance Tests
        run: cd artifacts/spaflow && npx playwright test performance.spec.ts
        continue-on-error: true
      - name: Upload Frontend Performance Metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-performance-metrics
          path: artifacts/spaflow/test-results/
          retention-days: 90
      - name: Check Performance Regression
        if: always()
        run: |
          echo "Performance regression check would compare current metrics against baseline"
          echo "If performance degrades by more than 20%, the check would fail"
          echo "This is a placeholder for future implementation with historical data"

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [component-tests, contract-tests]
    if: always() && (needs.component-tests.result == 'success' || needs.contract-tests.result == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup package-specific cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/api-server/node_modules/.cache
            artifacts/spaflow/node_modules/.cache
          key: ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/src/**', '**/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-pkg-cache-
      - name: Setup vitest cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/spaflow/node_modules/.vite
            artifacts/api-server/node_modules/.vite
          key: ${{ runner.os }}-vitest-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vitest-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run Coverage for Changed Packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Use pnpm --filter to run coverage only for changed packages
          pnpm --filter="...[$BASE_SHA]" --if-present run test:coverage:ci
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-server-coverage
          path: artifacts/api-server/coverage/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spaflow-coverage
          path: artifacts/spaflow/coverage/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lib-db-coverage
          path: lib/db/coverage/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lib-api-client-react-coverage
          path: lib/api-client-react/coverage/
          retention-days: 30

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spaflow_e2e_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup package-specific cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/api-server/node_modules/.cache
            artifacts/spaflow/node_modules/.cache
          key: ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/src/**', '**/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-pkg-cache-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-pkg-cache-
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Install Playwright Browsers
        run: cd artifacts/spaflow && pnpm exec playwright install --with-deps
        if: steps.cache-playwright.outputs.cache-hit != 'true'
      - name: Setup test database
        run: |
          cd lib/db
          pnpm run generate
          pnpm run migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spaflow_e2e_test
      - name: Seed test database
        run: cd scripts && pnpm run seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spaflow_e2e_test
          JWT_SECRET: test-secret-for-e2e-ci
          ENCRYPTION_KEY: test-encryption-key-32-chars-long
          CSRF_SECRET: test-csrf-secret-32-chars-long
      - name: Start API Server
        run: |
          cd artifacts/api-server
          pnpm run build
          pnpm run start &
          chmod +x ../../scripts/wait-for-server.sh
          ../../scripts/wait-for-server.sh http://localhost:5000/health 12 5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spaflow_e2e_test
          JWT_SECRET: test-secret-for-e2e-ci
          ENCRYPTION_KEY: test-encryption-key-32-chars-long
          CSRF_SECRET: test-csrf-secret-32-chars-long
          NODE_ENV: test
      - name: Start Frontend Server
        run: |
          cd artifacts/spaflow
          pnpm run build
          pnpm run serve &
          chmod +x ../../scripts/wait-for-server.sh
          ../../scripts/wait-for-server.sh http://localhost:4173 12 5
      - name: Detect if spaflow Changed
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Check if spaflow changed using pnpm --filter
          if pnpm --filter="...[$BASE_SHA]" --filter="@workspace/spaflow" exec echo "changed" 2>/dev/null | grep -q "changed"; then
            echo "spaflow_changed=true" >> $GITHUB_OUTPUT
          else
            echo "spaflow_changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Run E2E Tests (sharded)
        if: steps.detect.outputs.spaflow_changed == 'true' || github.ref == 'refs/heads/main'
        run: cd artifacts/spaflow && npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:4173
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spaflow_e2e_test
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: artifacts/spaflow/blob-report/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-snapshots-diff-shard-${{ matrix.shardIndex }}
          path: artifacts/spaflow/tests/e2e/*.spec.ts-snapshots/
          retention-days: 7

  e2e-merge-reports:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always() && needs.e2e-tests.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge reports
        run: cd artifacts/spaflow && npx playwright merge-reports --reporter html ../all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/spaflow/playwright-report/
          retention-days: 30

  smoke-load-tests:
    name: Smoke Load Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E34C5A
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt update
          sudo apt install k6
      - name: Start API Server
        run: |
          cd artifacts/api-server
          pnpm run build
          pnpm run start &
          chmod +x ../../scripts/wait-for-server.sh
          ../../scripts/wait-for-server.sh http://localhost:5000/health 12 5
      - name: Run Smoke Load Tests
        run: k6 run load-tests/smoke.js
        env:
          API_BASE_URL: http://localhost:5000/api

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: [build, smoke-load-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E34C5A
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt update
          sudo apt install k6
      - name: Start API Server
        run: |
          cd artifacts/api-server
          pnpm run build
          pnpm run start &
          chmod +x ../../scripts/wait-for-server.sh
          ../../scripts/wait-for-server.sh http://localhost:5000/health 12 5
      - name: Run Load Tests
        run: |
          pnpm run test:load:health
          pnpm run test:load:clients
          pnpm run test:load:dashboard
          pnpm run test:load:checkin
        env:
          API_BASE_URL: http://localhost:5000/api

  mutation-tests:
    name: Mutation Tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Setup stryker cache
        uses: actions/cache@v5
        with:
          path: |
            artifacts/api-server/.stryker-tmp
            artifacts/api-server/node_modules/.cache
          key: ${{ runner.os }}-stryker-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stryker-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Run Mutation Tests
        run: cd artifacts/api-server && pnpm run test:mutation:ci
      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: artifacts/api-server/reports/mutation/
          retention-days: 30

  flakiness-detection:
    name: Flakiness Detection
    runs-on: ubuntu-latest
    needs: [component-tests, contract-tests, e2e-tests]
    if: always() && (needs.component-tests.result == 'success' || needs.contract-tests.result == 'success' || needs.e2e-tests.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - name: Download Playwright Test Results
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report
          path: artifacts/spaflow/playwright-report
          merge-multiple: false
      - name: Run Flakiness Detection - Playwright
        if: always()
        run: cd scripts && pnpm run detect-flaky:playwright
        continue-on-error: true
      - name: Run Flakiness Detection - API Server
        if: always()
        run: cd scripts && pnpm run detect-flaky:api-server
        continue-on-error: true
      - name: Run Flakiness Detection - Spaflow
        if: always()
        run: cd scripts && pnpm run detect-flaky:spaflow
        continue-on-error: true
      - name: Upload Flakiness Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flakiness-reports
          path: |
            artifacts/api-server/flakiness-reports/
            artifacts/spaflow/flakiness-reports/
          retention-days: 30
      - name: Generate Flakiness Dashboard
        if: always()
        run: cd scripts && pnpm run generate-flakiness-dashboard
        continue-on-error: true
      - name: Upload Flakiness Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flakiness-dashboard
          path: artifacts/flakiness-dashboard.html
          retention-days: 30

  ci-gate:
    name: CI Gate - Merge Blocker
    runs-on: ubuntu-latest
    needs: [security-scan, codeql, typecheck, build, smoke-tests, contract-tests, component-tests, e2e-tests]
    if: always()
    steps:
      - name: Check critical job results
        run: |
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ Security scan failed"
            exit 1
          fi
          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "❌ CodeQL analysis failed"
            exit 1
          fi
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "❌ Type check failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build failed"
            exit 1
          fi
          if [ "${{ needs.smoke-tests.result }}" != "success" ]; then
            echo "❌ Smoke tests failed"
            exit 1
          fi
          if [ "${{ needs.contract-tests.result }}" != "success" ]; then
            echo "❌ Contract tests failed"
            exit 1
          fi
          if [ "${{ needs.component-tests.result }}" != "success" ]; then
            echo "❌ Component tests failed"
            exit 1
          fi
          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "❌ E2E tests failed - blocking merge"
            exit 1
          fi
          echo "✅ All critical checks passed"

