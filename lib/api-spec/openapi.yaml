openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SpaFlow - Spa Management System API
servers:
  - url: /api/v1
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: clients
    description: Client profile management
  - name: lockers
    description: Locker management
  - name: rooms
    description: Room management
  - name: pricing
    description: Dynamic pricing engine
  - name: waitlist
    description: Waitlist management
  - name: products
    description: Product inventory
  - name: transactions
    description: Transaction history
  - name: dashboard
    description: Dashboard and reporting
  - name: reports
    description: Revenue and utilization reports (manager only)
  - name: reconciliation
    description: Payment reconciliation (manager only)
  - name: users
    description: Staff user management
  - name: audit
    description: Audit logging
  - name: data-quality
    description: Data quality management (manager only)
  - name: saved-searches
    description: Saved search filters

paths:
  /healthz/live:
    get:
      operationId: livenessProbe
      tags: [health]
      summary: Liveness probe - checks if the application is running
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        "503":
          description: Application is not alive

  /healthz/ready:
    get:
      operationId: readinessProbe
      tags: [health]
      summary: Readiness probe - checks if dependencies are available
      responses:
        "200":
          description: All dependencies are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more dependencies are unhealthy

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Staff login
      x-rateLimit:
        limit: 5
        window: 15min
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Account locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLockedError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
          headers:
            Retry-After:
              description: Seconds until rate limit resets
              schema:
                type: integer

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Staff logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request password reset via email
      x-rateLimit:
        limit: 3
        window: 15min
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: Password reset email sent (generic response for security)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Confirm password reset with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmInput"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid token or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List active sessions for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
    delete:
      operationId: revokeAllSessions
      tags: [auth]
      summary: Revoke all sessions except current
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Current refresh token to keep active
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  revokedCount:
                    type: integer
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke a specific session
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Session ID to revoke
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Current refresh token to prevent revoking current session
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          description: Cannot revoke current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  # Clients
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: membershipStatus
          in: query
          schema:
            type: string
            enum: [none, one_time, six_month]
        - name: preset
          in: query
          schema:
            type: string
            enum: [active_members, expired_members, high_value, recent_visitors, inactive]
          description: Pre-defined filter presets (overrides individual filter parameters)
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Filter clients created on or after this date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: Filter clients created on or before this date
        - name: lastVisitAfter
          in: query
          schema:
            type: string
            format: date
          description: Filter clients with last visit on or after this date
        - name: lastVisitBefore
          in: query
          schema:
            type: string
            format: date
          description: Filter clients with last visit on or before this date
        - name: minVisits
          in: query
          schema:
            type: integer
          description: Filter clients with at least this many total visits
        - name: maxVisits
          in: query
          schema:
            type: integer
          description: Filter clients with at most this many total visits
        - name: minSpent
          in: query
          schema:
            type: number
          description: Filter clients who have spent at least this amount
        - name: maxSpent
          in: query
          schema:
            type: number
          description: Filter clients who have spent at most this amount
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{id}/memberships:
    post:
      operationId: addMembership
      tags: [clients]
      summary: Add membership to a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInput"
      responses:
        "201":
          description: Membership added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /clients/{id}/memberships/renew:
    post:
      operationId: renewMembership
      tags: [clients]
      summary: Renew an expired membership
      description: Renews a client's expired membership with payment processing. Only allowed for expired memberships.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewMembershipBody"
      responses:
        "200":
          description: Membership renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          description: Invalid request (membership not expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Client not found

  /clients/{id}/rentals:
    get:
      operationId: getClientRentals
      tags: [clients]
      summary: Get a client's rental history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client rental sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentalSession"

  /clients/{id}/rentals/{sessionId}/products:
    get:
      operationId: getClientRentalProducts
      tags: [clients]
      summary: Get products purchased during a specific rental session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Products purchased during the rental session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
        "404":
          description: Client or rental session not found

  /clients/{id}/transactions:
    get:
      operationId: getClientTransactions
      tags: [clients]
      summary: Get a client's transaction history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: query
          required: false
          schema:
            type: integer
          description: Filter transactions by rental session ID
      responses:
        "200":
          description: Client transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /clients/{id}/pii:
    get:
      operationId: getClientPii
      tags: [clients]
      summary: Get client PII (manager only)
      description: Retrieves decrypted PII (DOB, address, document number) for a client. Requires MANAGER role.
      x-rateLimit:
        limit: 10
        window: 1min
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client PII
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPii"
        "403":
          description: Forbidden - manager only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Not found

  /clients/suggest:
    get:
      operationId: suggestClients
      tags: [clients]
      summary: Get client name suggestions for autocomplete
      description: Returns client name suggestions based on partial input, prioritizing recent clients
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Partial name to search for
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Maximum number of suggestions to return
      responses:
        "200":
          description: List of client suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    email:
                      type: string
                      nullable: true
                    phone:
                      type: string
                      nullable: true
                    memberId:
                      type: string
                      nullable: true
        "400":
          description: Bad request - missing query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /clients/export:
    get:
      operationId: exportClients
      tags: [clients]
      summary: Export client search results to CSV
      description: Exports client search results as a CSV file for spreadsheet import. Accepts the same filter parameters as the list clients endpoint.
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: membershipStatus
          in: query
          schema:
            type: string
            enum: [none, one_time, six_month]
        - name: preset
          in: query
          schema:
            type: string
            enum: [active_members, expired_members, high_value, recent_visitors, inactive]
          description: Pre-defined filter presets (overrides individual filter parameters)
        - name: startDate
          in: query
          schema:
            type: string
            format: date
          description: Filter clients created on or after this date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
          description: Filter clients created on or before this date
        - name: lastVisitAfter
          in: query
          schema:
            type: string
            format: date
          description: Filter clients with last visit on or after this date
        - name: lastVisitBefore
          in: query
          schema:
            type: string
            format: date
          description: Filter clients with last visit on or before this date
        - name: minVisits
          in: query
          schema:
            type: integer
          description: Filter clients with at least this many total visits
        - name: maxVisits
          in: query
          schema:
            type: integer
          description: Filter clients with at most this many total visits
        - name: minSpent
          in: query
          schema:
            type: number
          description: Filter clients who have spent at least this amount
        - name: maxSpent
          in: query
          schema:
            type: number
          description: Filter clients who have spent at most this amount
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
              example: |
                ID,Name,Email,Phone,Member ID,Membership Status,Membership Expires,Created At
                1,John Doe,john@example.com,555-1234,SPF-ABC123,six_month,2026-12-31,2026-01-15
                2,Jane Smith,jane@example.com,555-5678,SPF-DEF456,one_time,2026-02-15,2026-01-20
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  # Saved Searches
  /saved-searches:
    get:
      operationId: listSavedSearches
      tags: [saved-searches]
      summary: List saved searches for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of saved searches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedSearch"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
    post:
      operationId: createSavedSearch
      tags: [saved-searches]
      summary: Create a saved search
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /saved-searches/{id}:
    get:
      operationId: getSavedSearch
      tags: [saved-searches]
      summary: Get a saved search
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Not found
    patch:
      operationId: updateSavedSearch
      tags: [saved-searches]
      summary: Update a saved search
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Not found
    delete:
      operationId: deleteSavedSearch
      tags: [saved-searches]
      summary: Delete a saved search
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Not found

  # Lockers
  /lockers:
    get:
      operationId: listLockers
      tags: [lockers]
      summary: List all lockers
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [available, occupied, reserved, maintenance]
      responses:
        "200":
          description: List of lockers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Locker"

  /lockers/occupancy:
    get:
      operationId: getLockersOccupancy
      tags: [lockers]
      summary: Get locker occupancy summary
      responses:
        "200":
          description: Occupancy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupancySummary"

  /lockers/{id}/assign:
    post:
      operationId: assignLocker
      tags: [lockers]
      summary: Assign a locker to a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignResourceInput"
      responses:
        "200":
          description: Locker assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /lockers/{id}/release:
    post:
      operationId: releaseLocker
      tags: [lockers]
      summary: Release a locker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Locker released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /lockers/{id}/renew:
    post:
      operationId: renewLocker
      tags: [lockers]
      summary: Renew locker for another 6 hours
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewInput"
      responses:
        "200":
          description: Locker renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /lockers/{id}/extend:
    post:
      operationId: extendLocker
      tags: [lockers]
      summary: Extend locker by 2 hours
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewInput"
      responses:
        "200":
          description: Locker extended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /lockers/bulk-release:
    post:
      operationId: bulkReleaseLockers
      tags: [lockers]
      summary: Bulk release lockers by operation type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkReleaseBody"
      responses:
        "200":
          description: Bulk release completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkReleaseResult"

  # Rooms
  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List all private rooms
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [available, occupied, reserved, maintenance]
      responses:
        "200":
          description: List of rooms
          content:
