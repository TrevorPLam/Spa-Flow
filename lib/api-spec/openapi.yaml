        "404":
          description: Client not found

  /data-quality/validate/bulk:
    post:
      operationId: bulkValidateClients
      tags: [data-quality]
      summary: Validate multiple clients in bulk (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientIds]
              properties:
                clientIds:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Validation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        $ref: "#/components/schemas/ValidationResult"
        "403":
          description: Manager access required

  /data-quality/merge:
    post:
      operationId: mergeClients
      tags: [data-quality]
      summary: Merge a duplicate client into a primary client (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [primaryId, duplicateId]
              properties:
                primaryId:
                  type: integer
                duplicateId:
                  type: integer
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/MergeResult"
        "403":
          description: Manager access required

  /clients/{id}/merge:
    post:
      operationId: mergeClientInto
      tags: [clients]
      summary: Merge a duplicate client into this client (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duplicateId]
              properties:
                duplicateId:
                  type: integer
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/MergeResult"
        "403":
          description: Manager access required
        "404":
          description: Client not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token for authentication
  schemas:
    # Standard error response format used across all endpoints
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code for programmatic handling
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - UNAUTHORIZED
            - FORBIDDEN
            - INTERNAL_ERROR
            - LOCKED
            - PAYMENT_ERROR

    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        uptime:
          type: number
          description: Process uptime in seconds
        timestamp:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, square, twilio, redis, jwt_secret, encryption_key, disk_space]
          properties:
            database:
              $ref: "#/components/schemas/HealthCheck"
            square:
              $ref: "#/components/schemas/HealthCheck"
            twilio:
              $ref: "#/components/schemas/HealthCheck"
            redis:
              $ref: "#/components/schemas/HealthCheck"
            jwt_secret:
              $ref: "#/components/schemas/HealthCheck"
            encryption_key:
              $ref: "#/components/schemas/HealthCheck"
            disk_space:
              $ref: "#/components/schemas/HealthCheck"

    HealthCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        message:
          type: string
          description: Optional message describing the check result
        latency_ms:
          type: number
          description: Latency of the health check in milliseconds

    # Auth
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]

    LoginResponse:
      type: object
      required: [id, email, name, role, refreshToken]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]
        refreshToken:
          type: string
          description: Refresh token for obtaining new access tokens

    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Refresh token to exchange for new access token

    RefreshTokenResponse:
      type: object
      required: [refreshToken, user]
      properties:
        refreshToken:
          type: string
          description: New refresh token (old one is invalidated)
        user:
          $ref: "#/components/schemas/AuthUser"

    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: Password reset token from email
        newPassword:
          type: string
          minLength: 15
          maxLength: 64
          description: New password (minimum 15 characters per NIST SP 800-63B Rev 4)

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Session:
      type: object
      required: [id, userId, createdAt, expiresAt, isCurrent]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userAgent:
          type: ["string", "null"]
          description: Hash of user agent string (privacy)
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
          description: Whether this is the current session

    SessionsList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    AuthError:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          description: Error code for programmatic handling
          enum:
            - AUTH_001
            - AUTH_002
            - AUTH_003
            - AUTH_004
            - AUTH_005
            - AUTH_006
            - AUTH_007
            - AUTH_008
            - AUTH_009
            - AUTH_010
        error:
          type: string
          description: Human-readable error message

    AccountLockedError:
      type: object
      required: [code, error, lockedUntil]
      properties:
        code:
          type: string
          enum: [AUTH_007]
        error:
          type: string
        lockedUntil:
          type: string
          format: date-time
          description: Timestamp when account lockout expires

    # Users
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [email, name, password, role]
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]
        password:
          type: string

    # Clients
    Client:
      type: object
      required: [id, name, membershipStatus, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        memberId:
          type: ["string", "null"]
        membershipStatus:
          type: string
          enum: [none, one_time, six_month]
        membershipExpiresAt:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
        smsRemindersEnabled:
          type: ["string", "null"]
          enum: ["true", "false"]
        # PII fields - only decrypted for MANAGER role
        dob:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        documentNumber:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        activeSessions:
          type: array
          items:
            $ref: "#/components/schemas/RentalSession"

    ClientPii:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        dob:
          type: ["string", "null"]
          description: Decrypted date of birth
        address:
          type: ["string", "null"]
          description: Decrypted address
        documentNumber:
          type: ["string", "null"]
          description: Decrypted document number (ID, license, etc.)

    SavedSearch:
      type: object
      required: [id, userId, name, filters, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
          description: User ID who owns this saved search
        name:
          type: string
          description: Name of the saved search
        filters:
          type: object
          description: Search filter parameters (JSON object)
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SavedSearchInput:
      type: object
      required: [name, filters]
      properties:
        name:
          type: string
          description: Name of the saved search
        filters:
          type: object
          description: Search filter parameters (JSON object)
          additionalProperties: true

    SavedSearchUpdate:
      type: object
      properties:
        name:
          type: string
          description: Name of the saved search
        filters:
          type: object
          description: Search filter parameters (JSON object)
          additionalProperties: true

    ClientInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        dob:
          type: string
        address:
          type: string
        documentNumber:
          type: string
        membershipStatus:
          type: string
          enum: [none, one_time, six_month]
        notes:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        dob:
          type: string
        address:
          type: string
        documentNumber:
          type: string
        membershipStatus:
          type: string
          enum: [none, one_time, six_month]
        notes:
          type: string
        smsRemindersEnabled:
          type: string
          enum: ["true", "false"]

    ClientList:
      type: object
      required: [clients, total, page, limit]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Memberships
    Membership:
      type: object
      required: [id, clientId, type, purchasedAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        type:
          type: string
          enum: [one_time, six_month]
        purchasedAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

    MembershipInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [one_time, six_month]
        paymentToken:
          type: string
        idempotencyKey:
          type: string

    RenewMembershipBody:
      type: object
      required: [membershipType, paymentToken, idempotencyKey]
      properties:
        membershipType:
          type: string
          enum: [one_time, six_month]
        paymentToken:
          type: string
        idempotencyKey:
          type: string

    # Lockers & Rooms
    Locker:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [available, occupied, reserved, maintenance]
        maintenanceNotes:
          type: ["string", "null"]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        sessionId:
          type: ["integer", "null"]
        startTime:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

    Room:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [available, occupied, reserved, maintenance]
        maintenanceNotes:
          type: ["string", "null"]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        sessionId:
          type: ["integer", "null"]
        startTime:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

    BulkReleaseBody:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          enum: [all_expired, by_status, by_ids]
          description: Type of bulk release operation
        status:
          type: string
          enum: [occupied, reserved]
          description: Status filter (required when operation is by_status)
        resourceIds:
          type: array
          items:
            type: integer
          description: Array of resource IDs to release (required when operation is by_ids)

    BulkReleaseResult:
      type: object
      required: [totalRequested, totalReleased, failed]
      properties:
        totalRequested:
          type: integer
          description: Number of resources requested for release
        totalReleased:
          type: integer
          description: Number of resources successfully released
        failed:
          type: array
          items:
            type: object
            properties:
              resourceId:
                type: integer
              reason:
                type: string
          description: List of resources that failed to release with reasons

    OccupancySummary:
      type: object
      required: [total, available, occupied, reserved, maintenance]
      properties:
        total:
          type: integer
        available:
          type: integer
        occupied:
          type: integer
        reserved:
          type: integer
        maintenance:
          type: integer

    AssignResourceInput:
      type: object
      required: [clientId, paymentToken, idempotencyKey]
      properties:
        clientId:
          type: integer
        paymentToken:
          type: string
        idempotencyKey:
          type: string
        membershipType:
          type: string
          enum: [one_time, six_month]

    RenewInput:
      type: object
      required: [paymentToken, idempotencyKey]
      properties:
        paymentToken:
          type: string
        idempotencyKey:
          type: string

    # Rental Sessions
    RentalSession:
      type: object
      required: [id, clientId, resourceType, resourceId, resourceName, status, startTime]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        resourceType:
          type: string
          enum: [locker, room]
        resourceId:
          type: integer
        resourceName:
          type: string
        status:
          type: string
          enum: [active, completed, expired]
        startTime:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        endTime:
          type: ["string", "null"]
          format: date-time
        amountPaid:
          type: ["number", "null"]

    # Pricing
    PriceCalculationInput:
      type: object
      required: [clientId, resourceType]
      properties:
        clientId:
          type: integer
        resourceType:
          type: string
          enum: [locker, room]
        membershipType:
          type: ["string", "null"]
          enum: [one_time, six_month, null]
        roomTier:
          type: ["string", "null"]
          enum: [standard, premium, deluxe]
        selectedPrice:
          type: ["number", "null"]
          description: Selected price within allowed range for rooms (only applicable for room rentals)
          minimum: 0

    PriceCalculation:
      type: object
      required: [subtotal, tax, total, appliedRules]
      properties:
        subtotal:
          type: number
        tax:
          type: number
        total:
          type: number
        appliedRules:
          type: array
          items:
            type: string

    # Check-in
    CheckInInput:
      type: object
      required: [clientId, resourceType, resourceId, paymentToken, idempotencyKey]
      properties:
        clientId:
          type: integer
        resourceType:
          type: string
          enum: [locker, room]
        resourceId:
          type: integer
        paymentToken:
          type: string
        idempotencyKey:
          type: string
        membershipType:
          type: ["string", "null"]
          enum: [one_time, six_month, null]
        productIds:
          type: array
          items:
            type: integer
        roomTier:
          type: ["string", "null"]
          enum: [standard, premium, deluxe]
        selectedPrice:
          type: ["number", "null"]
          description: Selected price within allowed range for rooms (only applicable for room rentals)
          minimum: 0

    CheckInResult:
      type: object
      required: [session, transaction]
      properties:
        session:
          $ref: "#/components/schemas/RentalSession"
        transaction:
          $ref: "#/components/schemas/Transaction"
        membership:
          $ref: "#/components/schemas/Membership"
        membershipBundled:
          type: boolean
          description: Whether membership was auto-bundled for 1824 special

    # Waitlist
    WaitlistEntry:
      type: object
      required: [id, clientId, position, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        clientPhone:
          type: ["string", "null"]
        position:
          type: integer
        status:
          type: string
          enum: [waiting, assigned, confirmed, expired]
        assignedRoomId:
          type: ["integer", "null"]
        assignedRoomName:
          type: ["string", "null"]
        currentLockerId:
          type: ["integer", "null"]
        currentLockerName:
          type: ["string", "null"]
        assignedAt:
          type: ["string", "null"]
          format: date-time
        confirmBy:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    WaitlistInput:
      type: object
      required: [clientId]
      properties:
        clientId:
          type: integer

    # Products
    Product:
      type: object
      required: [id, name, price, stock, lowStockThreshold]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        stock:
          type: integer
        lowStockThreshold:
          type: integer
          default: 5
        category:
          type: ["string", "null"]

    ProductInput:
      type: object
      required: [name, price, stock]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        lowStockThreshold:
          type: integer
          default: 5
        category:
          type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        lowStockThreshold:
          type: integer
        category:
          type: string

    # Transactions
    Transaction:
      type: object
      required: [id, clientId, amount, type, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        amount:
          type: number
        tax:
          type: number
        total:
          type: number
        type:
          type: string
          enum: [locker_rental, room_rental, membership, product, renewal, extension]
        squarePaymentId:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TransactionList:
      type: object
      required: [transactions, total, page, limit]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Dashboard
    Dashboard:
      type: object
      required: [lockerOccupancy, roomOccupancy, todayRevenue, activeClients, waitlistCount, recentTransactions, activeRentals, lowStockCount]
      properties:
        lockerOccupancy:
          $ref: "#/components/schemas/OccupancySummary"
        roomOccupancy:
          $ref: "#/components/schemas/OccupancySummary"
        todayRevenue:
          type: number
        activeClients:
          type: integer
        waitlistCount:
          type: integer
        lowStockCount:
          type: integer
        lowStockProducts:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              stock:
                type: integer
              lowStockThreshold:
                type: integer
              category:
                type: ["string", "null"]
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        activeRentals:
          type: array
          items:
            $ref: "#/components/schemas/RentalSession"

    # Reports
    RevenueReport:
      type: object
      required: [data, totalRevenue, startDate, endDate, granularity]
      properties:
        data:
          type: array
          items:
            type: object
            required: [date, revenue, tax, total]
            properties:
              date:
                type: string
                format: date-time
              revenue:
                type: number
              tax:
                type: number
              total:
                type: number
              transactionCount:
                type: integer
        totalRevenue:
          type: number
        totalTax:
          type: number
        total:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        granularity:
          type: string
          enum: [daily, weekly, monthly]

    RevenueByTypeReport:
      type: object
      required: [data, totalRevenue, startDate, endDate]
      properties:
        data:
          type: array
          items:
            type: object
            required: [type, revenue, tax, total, count]
            properties:
              type:
                type: string
                enum: [locker_rental, room_rental, membership, product, renewal, extension]
              revenue:
                type: number
              tax:
                type: number
              total:
                type: number
              count:
                type: integer
        totalRevenue:
          type: number
        totalTax:
          type: number
        total:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    UtilizationReport:
      type: object
      required: [data, averageUtilization, totalCapacity, startDate, endDate, granularity]
      properties:
        data:
          type: array
          items:
            type: object
            required: [date, occupiedCount, totalCapacity, utilizationRate]
            properties:
              date:
                type: string
                format: date-time
              occupiedCount:
                type: integer
              totalCapacity:
                type: integer
              utilizationRate:
                type: string
        averageUtilization:
          type: number
        totalCapacity:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        granularity:
          type: string
          enum: [daily, weekly, monthly]

    PeakHoursReport:
      type: object
      required: [data, peakHour, averageRentalsPerHour, totalRentals, startDate, endDate]
      properties:
        data:
          type: array
          items:
            type: object
            required: [hour, lockerRentals, roomRentals, totalRentals]
            properties:
              hour:
                type: integer
                minimum: 0
                maximum: 23
              lockerRentals:
                type: integer
              roomRentals:
                type: integer
              totalRentals:
                type: integer
        peakHour:
          type: object
          nullable: true
          required: [hour, totalRentals]
          properties:
            hour:
              type: integer
              minimum: 0
              maximum: 23
            totalRentals:
              type: integer
        averageRentalsPerHour:
          type: number
