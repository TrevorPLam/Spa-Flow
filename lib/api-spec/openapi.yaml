openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SpaFlow - Spa Management System API
servers:
  - url: /api/v1
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: clients
    description: Client profile management
  - name: lockers
    description: Locker management
  - name: rooms
    description: Room management
  - name: pricing
    description: Dynamic pricing engine
  - name: waitlist
    description: Waitlist management
  - name: products
    description: Product inventory
  - name: transactions
    description: Transaction history
  - name: dashboard
    description: Dashboard and reporting
  - name: reports
    description: Revenue and utilization reports (manager only)
  - name: users
    description: Staff user management
  - name: audit
    description: Audit logging

paths:
  /healthz/live:
    get:
      operationId: livenessProbe
      tags: [health]
      summary: Liveness probe - checks if the application is running
      responses:
        "200":
          description: Application is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        "503":
          description: Application is not alive

  /healthz/ready:
    get:
      operationId: readinessProbe
      tags: [health]
      summary: Readiness probe - checks if dependencies are available
      responses:
        "200":
          description: All dependencies are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more dependencies are unhealthy

  # Auth
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Staff login
      x-rateLimit:
        limit: 5
        window: 15min
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Account locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLockedError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
          headers:
            Retry-After:
              description: Seconds until rate limit resets
              schema:
                type: integer

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Staff logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenInput"
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request password reset via email
      x-rateLimit:
        limit: 3
        window: 15min
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: Password reset email sent (generic response for security)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Confirm password reset with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmInput"
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid token or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List active sessions for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
    delete:
      operationId: revokeAllSessions
      tags: [auth]
      summary: Revoke all sessions except current
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Current refresh token to keep active
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  revokedCount:
                    type: integer
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  /auth/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke a specific session
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Session ID to revoke
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Current refresh token to prevent revoking current session
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          description: Cannot revoke current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"

  # Clients
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: membershipStatus
          in: query
          schema:
            type: string
            enum: [none, one_time, six_month]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{id}/memberships:
    post:
      operationId: addMembership
      tags: [clients]
      summary: Add membership to a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInput"
      responses:
        "201":
          description: Membership added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /clients/{id}/rentals:
    get:
      operationId: getClientRentals
      tags: [clients]
      summary: Get a client's rental history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client rental sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentalSession"

  /clients/{id}/transactions:
    get:
      operationId: getClientTransactions
      tags: [clients]
      summary: Get a client's transaction history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  # Lockers
  /lockers:
    get:
      operationId: listLockers
      tags: [lockers]
      summary: List all lockers
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [available, occupied, reserved]
      responses:
        "200":
          description: List of lockers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Locker"

  /lockers/occupancy:
    get:
      operationId: getLockersOccupancy
      tags: [lockers]
      summary: Get locker occupancy summary
      responses:
        "200":
          description: Occupancy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupancySummary"

  /lockers/{id}/assign:
    post:
      operationId: assignLocker
      tags: [lockers]
      summary: Assign a locker to a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignResourceInput"
      responses:
        "200":
          description: Locker assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /lockers/{id}/release:
    post:
      operationId: releaseLocker
      tags: [lockers]
      summary: Release a locker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Locker released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /lockers/{id}/renew:
    post:
      operationId: renewLocker
      tags: [lockers]
      summary: Renew locker for another 6 hours
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewInput"
      responses:
        "200":
          description: Locker renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /lockers/{id}/extend:
    post:
      operationId: extendLocker
      tags: [lockers]
      summary: Extend locker by 2 hours
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewInput"
      responses:
        "200":
          description: Locker extended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  # Rooms
  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List all private rooms
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [available, occupied, reserved]
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /rooms/occupancy:
    get:
      operationId: getRoomsOccupancy
      tags: [rooms]
      summary: Get room occupancy summary
      responses:
        "200":
          description: Occupancy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupancySummary"

  /rooms/{id}/assign:
    post:
      operationId: assignRoom
      tags: [rooms]
      summary: Assign a room to a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignResourceInput"
      responses:
        "200":
          description: Room assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /rooms/{id}/release:
    post:
      operationId: releaseRoom
      tags: [rooms]
      summary: Release a room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /rooms/{id}/renew:
    post:
      operationId: renewRoom
      tags: [rooms]
      summary: Renew room for another 6 hours
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewInput"
      responses:
        "200":
          description: Room renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  /rooms/{id}/extend:
    post:
      operationId: extendRoom
      tags: [rooms]
      summary: Extend room by 2 hours
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewInput"
      responses:
        "200":
          description: Room extended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalSession"

  # Pricing
  /pricing/calculate:
    post:
      operationId: calculatePrice
      tags: [pricing]
      summary: Calculate price for a rental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceCalculationInput"
      responses:
        "200":
          description: Price calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceCalculation"

  # Check-in
  /checkin:
    post:
      operationId: checkIn
      tags: [clients]
      summary: Full check-in flow - process payment and assign resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "200":
          description: Check-in successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResult"

  # Waitlist
  /waitlist:
    get:
      operationId: listWaitlist
      tags: [waitlist]
      summary: List waitlist entries
      responses:
        "200":
          description: Waitlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WaitlistEntry"
    post:
      operationId: addToWaitlist
      tags: [waitlist]
      summary: Add client to waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "201":
          description: Added to waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"

  /waitlist/{id}:
    delete:
      operationId: removeFromWaitlist
      tags: [waitlist]
      summary: Remove from waitlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /waitlist/{id}/confirm:
    post:
      operationId: confirmWaitlistAssignment
      tags: [waitlist]
      summary: Client confirms room assignment from waitlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistEntry"

  # Products
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /products/low-stock:
    get:
      operationId: listLowStockProducts
      tags: [products]
      summary: List products with low stock
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  count:
                    type: integer

  # Transactions
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions
      parameters:
        - name: clientId
          in: query
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
            description: Filter transactions created on or after this date (ISO 8601 format)
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
            description: Filter transactions created on or before this date (ISO 8601 format)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"

  # Dashboard
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  # Reports
  /reports/revenue:
    get:
      operationId: getRevenueReport
      tags: [reports]
      summary: Get revenue report by date range (manager only)
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Start date for report (ISO 8601 format)
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: End date for report (ISO 8601 format)
        - name: granularity
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: daily
          description: Time granularity for aggregation
      responses:
        "200":
          description: Revenue report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueReport"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - manager only

  /reports/revenue-by-type:
    get:
      operationId: getRevenueByType
      tags: [reports]
      summary: Get revenue breakdown by service type (manager only)
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Start date for report (ISO 8601 format)
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: End date for report (ISO 8601 format)
      responses:
        "200":
          description: Revenue by type data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueByTypeReport"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - manager only

  /reports/utilization/lockers:
    get:
      operationId: getLockerUtilization
      tags: [reports]
      summary: Get locker utilization rates over time (manager only)
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Start date for report (ISO 8601 format)
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: End date for report (ISO 8601 format)
        - name: granularity
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: daily
          description: Time granularity for aggregation
      responses:
        "200":
          description: Locker utilization data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilizationReport"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - manager only

  /reports/utilization/rooms:
    get:
      operationId: getRoomUtilization
      tags: [reports]
      summary: Get room utilization rates over time (manager only)
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Start date for report (ISO 8601 format)
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: End date for report (ISO 8601 format)
        - name: granularity
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: daily
          description: Time granularity for aggregation
      responses:
        "200":
          description: Room utilization data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UtilizationReport"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - manager only

  /reports/utilization/peak-hours:
    get:
      operationId: getPeakHours
      tags: [reports]
      summary: Get peak hours analysis for rentals (manager only)
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: Start date for report (ISO 8601 format)
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: End date for report (ISO 8601 format)
      responses:
        "200":
          description: Peak hours data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeakHoursReport"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden - manager only

  # Users
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List staff users (manager only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a staff user (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a staff user (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a staff user (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Audit Logs
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs (manager only)
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
            description: Filter audit logs created on or after this date (ISO 8601 format)
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
            description: Filter audit logs created on or before this date (ISO 8601 format)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: action
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token for authentication
  schemas:
    # Standard error response format used across all endpoints
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code for programmatic handling
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - CONFLICT
            - UNAUTHORIZED
            - FORBIDDEN
            - INTERNAL_ERROR
            - LOCKED
            - PAYMENT_ERROR

    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        uptime:
          type: number
          description: Process uptime in seconds
        timestamp:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, square, twilio, redis, jwt_secret, encryption_key]
          properties:
            database:
              $ref: "#/components/schemas/HealthCheck"
            square:
              $ref: "#/components/schemas/HealthCheck"
            twilio:
              $ref: "#/components/schemas/HealthCheck"
            redis:
              $ref: "#/components/schemas/HealthCheck"
            jwt_secret:
              $ref: "#/components/schemas/HealthCheck"
            encryption_key:
              $ref: "#/components/schemas/HealthCheck"

    HealthCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, degraded]
        message:
          type: string
          description: Optional message describing the check result
        latency_ms:
          type: number
          description: Latency of the health check in milliseconds

    # Auth
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]

    LoginResponse:
      type: object
      required: [id, email, name, role, refreshToken]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]
        refreshToken:
          type: string
          description: Refresh token for obtaining new access tokens

    RefreshTokenInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Refresh token to exchange for new access token

    RefreshTokenResponse:
      type: object
      required: [refreshToken, user]
      properties:
        refreshToken:
          type: string
          description: New refresh token (old one is invalidated)
        user:
          $ref: "#/components/schemas/AuthUser"

    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: Password reset token from email
        newPassword:
          type: string
          minLength: 15
          maxLength: 64
          description: New password (minimum 15 characters per NIST SP 800-63B Rev 4)

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Session:
      type: object
      required: [id, userId, createdAt, expiresAt, isCurrent]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userAgent:
          type: ["string", "null"]
          description: Hash of user agent string (privacy)
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
          description: Whether this is the current session

    SessionsList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    AuthError:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          description: Error code for programmatic handling
          enum:
            - AUTH_001
            - AUTH_002
            - AUTH_003
            - AUTH_004
            - AUTH_005
            - AUTH_006
            - AUTH_007
            - AUTH_008
            - AUTH_009
            - AUTH_010
        error:
          type: string
          description: Human-readable error message

    AccountLockedError:
      type: object
      required: [code, error, lockedUntil]
      properties:
        code:
          type: string
          enum: [AUTH_007]
        error:
          type: string
        lockedUntil:
          type: string
          format: date-time
          description: Timestamp when account lockout expires

    # Users
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [email, name, password, role]
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
          enum: [STAFF, MANAGER]
        password:
          type: string

    # Clients
    Client:
      type: object
      required: [id, name, membershipStatus, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        memberId:
          type: ["string", "null"]
        membershipStatus:
          type: string
          enum: [none, one_time, six_month]
        membershipExpiresAt:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
        # PII fields - only decrypted for MANAGER role
        dob:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        documentNumber:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        activeSessions:
          type: array
          items:
            $ref: "#/components/schemas/RentalSession"

    ClientInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        dob:
          type: string
        address:
          type: string
        documentNumber:
          type: string
        membershipStatus:
          type: string
          enum: [none, one_time, six_month]
        notes:
          type: string

    ClientUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        dob:
          type: string
        address:
          type: string
        documentNumber:
          type: string
        membershipStatus:
          type: string
          enum: [none, one_time, six_month]
        notes:
          type: string

    ClientList:
      type: object
      required: [clients, total, page, limit]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Memberships
    Membership:
      type: object
      required: [id, clientId, type, purchasedAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        type:
          type: string
          enum: [one_time, six_month]
        purchasedAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

    MembershipInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [one_time, six_month]
        paymentToken:
          type: string
        idempotencyKey:
          type: string

    # Lockers & Rooms
    Locker:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [available, occupied, reserved]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        sessionId:
          type: ["integer", "null"]
        startTime:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

    Room:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [available, occupied, reserved]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        sessionId:
          type: ["integer", "null"]
        startTime:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

    OccupancySummary:
      type: object
      required: [total, available, occupied, reserved]
      properties:
        total:
          type: integer
        available:
          type: integer
        occupied:
          type: integer
        reserved:
          type: integer

    AssignResourceInput:
      type: object
      required: [clientId, paymentToken, idempotencyKey]
      properties:
        clientId:
          type: integer
        paymentToken:
          type: string
        idempotencyKey:
          type: string
        membershipType:
          type: string
          enum: [one_time, six_month]

    RenewInput:
      type: object
      required: [paymentToken, idempotencyKey]
      properties:
        paymentToken:
          type: string
        idempotencyKey:
          type: string

    # Rental Sessions
    RentalSession:
      type: object
      required: [id, clientId, resourceType, resourceId, resourceName, status, startTime]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        resourceType:
          type: string
          enum: [locker, room]
        resourceId:
          type: integer
        resourceName:
          type: string
        status:
          type: string
          enum: [active, completed, expired]
        startTime:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        endTime:
          type: ["string", "null"]
          format: date-time
        amountPaid:
          type: ["number", "null"]

    # Pricing
    PriceCalculationInput:
      type: object
      required: [clientId, resourceType]
      properties:
        clientId:
          type: integer
        resourceType:
          type: string
          enum: [locker, room]
        membershipType:
          type: ["string", "null"]
          enum: [one_time, six_month, null]

    PriceCalculation:
      type: object
      required: [subtotal, tax, total, appliedRules]
      properties:
        subtotal:
          type: number
        tax:
          type: number
        total:
          type: number
        appliedRules:
          type: array
          items:
            type: string

    # Check-in
    CheckInInput:
      type: object
      required: [clientId, resourceType, resourceId, paymentToken, idempotencyKey]
      properties:
        clientId:
          type: integer
        resourceType:
          type: string
          enum: [locker, room]
        resourceId:
          type: integer
        paymentToken:
          type: string
        idempotencyKey:
          type: string
        membershipType:
          type: ["string", "null"]
          enum: [one_time, six_month, null]
        productIds:
          type: array
          items:
            type: integer
        roomTier:
          type: ["string", "null"]
          enum: [standard, premium, deluxe]

    CheckInResult:
      type: object
      required: [session, transaction]
      properties:
        session:
          $ref: "#/components/schemas/RentalSession"
        transaction:
          $ref: "#/components/schemas/Transaction"
        membership:
          $ref: "#/components/schemas/Membership"

    # Waitlist
    WaitlistEntry:
      type: object
      required: [id, clientId, position, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        clientPhone:
          type: ["string", "null"]
        position:
          type: integer
        status:
          type: string
          enum: [waiting, assigned, confirmed, expired]
        assignedRoomId:
          type: ["integer", "null"]
        assignedRoomName:
          type: ["string", "null"]
        currentLockerId:
          type: ["integer", "null"]
        currentLockerName:
          type: ["string", "null"]
        assignedAt:
          type: ["string", "null"]
          format: date-time
        confirmBy:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    WaitlistInput:
      type: object
      required: [clientId]
      properties:
        clientId:
          type: integer

    # Products
    Product:
      type: object
      required: [id, name, price, stock, lowStockThreshold]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        stock:
          type: integer
        lowStockThreshold:
          type: integer
          default: 5
        category:
          type: ["string", "null"]

    ProductInput:
      type: object
      required: [name, price, stock]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        lowStockThreshold:
          type: integer
          default: 5
        category:
          type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: integer
        lowStockThreshold:
          type: integer
        category:
          type: string

    # Transactions
    Transaction:
      type: object
      required: [id, clientId, amount, type, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        amount:
          type: number
        tax:
          type: number
        total:
          type: number
        type:
          type: string
          enum: [locker_rental, room_rental, membership, product, renewal, extension]
        squarePaymentId:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    TransactionList:
      type: object
      required: [transactions, total, page, limit]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # Dashboard
    Dashboard:
      type: object
      required: [lockerOccupancy, roomOccupancy, todayRevenue, activeClients, waitlistCount, recentTransactions, activeRentals, lowStockCount]
      properties:
        lockerOccupancy:
          $ref: "#/components/schemas/OccupancySummary"
        roomOccupancy:
          $ref: "#/components/schemas/OccupancySummary"
        todayRevenue:
          type: number
        activeClients:
          type: integer
        waitlistCount:
          type: integer
        lowStockCount:
          type: integer
        lowStockProducts:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              stock:
                type: integer
              lowStockThreshold:
                type: integer
              category:
                type: ["string", "null"]
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        activeRentals:
          type: array
          items:
            $ref: "#/components/schemas/RentalSession"

    # Reports
    RevenueReport:
      type: object
      required: [data, totalRevenue, startDate, endDate, granularity]
      properties:
        data:
          type: array
          items:
            type: object
            required: [date, revenue, tax, total]
            properties:
              date:
                type: string
                format: date-time
              revenue:
                type: number
              tax:
                type: number
              total:
                type: number
              transactionCount:
                type: integer
        totalRevenue:
          type: number
        totalTax:
          type: number
        total:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        granularity:
          type: string
          enum: [daily, weekly, monthly]

    RevenueByTypeReport:
      type: object
      required: [data, totalRevenue, startDate, endDate]
      properties:
        data:
          type: array
          items:
            type: object
            required: [type, revenue, tax, total, count]
            properties:
              type:
                type: string
                enum: [locker_rental, room_rental, membership, product, renewal, extension]
              revenue:
                type: number
              tax:
                type: number
              total:
                type: number
              count:
                type: integer
        totalRevenue:
          type: number
        totalTax:
          type: number
        total:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    UtilizationReport:
      type: object
      required: [data, averageUtilization, totalCapacity, startDate, endDate, granularity]
      properties:
        data:
          type: array
          items:
            type: object
            required: [date, occupiedCount, totalCapacity, utilizationRate]
            properties:
              date:
                type: string
                format: date-time
              occupiedCount:
                type: integer
              totalCapacity:
                type: integer
              utilizationRate:
                type: string
        averageUtilization:
          type: number
        totalCapacity:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        granularity:
          type: string
          enum: [daily, weekly, monthly]

    PeakHoursReport:
      type: object
      required: [data, peakHour, averageRentalsPerHour, totalRentals, startDate, endDate]
      properties:
        data:
          type: array
          items:
            type: object
            required: [hour, lockerRentals, roomRentals, totalRentals]
            properties:
              hour:
                type: integer
                minimum: 0
                maximum: 23
              lockerRentals:
                type: integer
              roomRentals:
                type: integer
              totalRentals:
                type: integer
        peakHour:
          type: object
          nullable: true
          required: [hour, totalRentals]
          properties:
            hour:
              type: integer
              minimum: 0
              maximum: 23
            totalRentals:
              type: integer
        averageRentalsPerHour:
          type: number
        totalRentals:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time

    # Audit Logs
    AuditLog:
      type: object
      required: [id, userId, action, resourceType, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: ["string", "null"]
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: ["integer", "null"]
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AuditLogList:
      type: object
      required: [logs, total, page, limit]
      properties:
        logs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
